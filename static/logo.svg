<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="cg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="cg-shield-grad" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cg-check-grad" x1="36" y1="42" x2="88" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="cg-card-bg" x1="20" y1="15" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="cg-quote-grad" x1="30" y1="30" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <path d="M60 14 L96 28 C96 66 78 94 60 106 C42 94 24 66 24 28 Z"
        fill="url(#cg-shield-grad)" opacity="0.35" filter="url(#cg-glow)" />

  <!-- Shield Base Background -->
  <path d="M60 16 L94 29 C94 64 77 91 60 102 C43 91 26 64 26 29 Z"
        fill="url(#cg-card-bg)" stroke="url(#cg-shield-grad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Subtle Circuit / Neural Grid Lines Inside Shield -->
  <path d="M42 36 L60 36 M60 36 L78 36" stroke="#4338ca" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7" />
  <path d="M35 50 L48 50 M72 50 L85 50" stroke="#4338ca" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <path d="M60 26 L60 44" stroke="#6366f1" stroke-width="1.5" opacity="0.5" />
  <circle cx="60" cy="36" r="2.5" fill="#818cf8" />
  <circle cx="48" cy="50" r="2" fill="#a78bfa" />
  <circle cx="72" cy="50" r="2" fill="#38bdf8" />

  <!-- Academic Citation Book / Double Bracket Motif -->
  <path d="M38 46 C38 41 42 38 47 38 L54 38 C56 38 57 39 57 41 L57 66 C57 68 55 69 53 69 L47 69 C42 69 38 65 38 60 Z"
        fill="url(#cg-quote-grad)" opacity="0.35" />

  <!-- High-Precision Dynamic Verification Checkmark (Shield Overlay) -->
  <path d="M42 58 L54 70 L80 44"
        stroke="url(#cg-check-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Checkmark highlight glow line -->
  <path d="M43 58 L54 69 L79 44"
        stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Sparkle Vertex Node at Tip -->
  <circle cx="80" cy="44" r="3.5" fill="#34d399" />
  <circle cx="80" cy="44" r="6" stroke="#34d399" stroke-width="1.5" opacity="0.6" />
</svg>
